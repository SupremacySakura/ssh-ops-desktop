[package]
name = "opspilot-desktop"
version = "0.1.0"
description = "Harbor desktop shell"
edition.workspace = true
license.workspace = true

[lib]
name = "opspilot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
opspilot-domain = { path = "../crates/domain" }
opspilot-persistence = { path = "../crates/persistence" }
opspilot-secrets = { path = "../crates/secrets" }
serde.workspace = true
sqlx.workspace = true
tauri = { version = "2", features = [] }
tokio.workspace = true

[dev-dependencies]
async-trait.workspace = true
serde_json.workspace = true
