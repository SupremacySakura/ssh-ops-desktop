[package]
name = "opspilot-desktop"
version = "0.1.0"
description = "OpsPilot desktop shell"
edition.workspace = true
license.workspace = true

[lib]
name = "opspilot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
native-e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
csv.workspace = true
opspilot-audit = { path = "../crates/audit" }
opspilot-domain = { path = "../crates/domain" }
opspilot-persistence = { path = "../crates/persistence" }
opspilot-secrets = { path = "../crates/secrets" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-wdio = { version = "=1.3.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "=1.3.0", optional = true }
tokio.workspace = true

[dev-dependencies]
async-trait.workspace = true
