[package]
name = "opspilot-desktop"
version = "0.1.0"
description = "Harbor desktop shell"
edition.workspace = true
license.workspace = true

[lib]
name = "opspilot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = { version = "3", default-features = false }
async-trait.workspace = true
opspilot-domain = { path = "../crates/domain" }
opspilot-persistence = { path = "../crates/persistence" }
opspilot-remote-adapters = { path = "../crates/remote-adapters" }
opspilot-secrets = { path = "../crates/secrets" }
opspilot-ssh-core = { path = "../crates/ssh-core" }
serde.workspace = true
sqlx.workspace = true
tauri = { version = "2", features = [] }
tokio.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
