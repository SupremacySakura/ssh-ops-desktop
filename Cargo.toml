[workspace]
resolver = "2"
members = ["src-tauri", "crates/*"]

[workspace.package]
edition = "2024"
license = "UNLICENSED"

[workspace.dependencies]
async-trait = "0.1.91"
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
csv = "1.4.0"
keyring = "4.1.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
russh = { version = "0.62.5", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "2.3.0"
sqlx = { version = "0.9.0", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite-bundled"] }
tempfile = "3.27.0"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1.9.0"
